# Jean CRM — implantação de produção (Twenty v2.9.0, imagem oficial fixada).
# Só o Caddy publica portas (80/443). PostgreSQL, Redis e o servidor ficam na rede interna.
# Uso: veja docs/JEAN_PRODUCTION.md. Segredos só no arquivo .env (fora do Git).
name: jean-crm

x-twenty-env: &twenty-env
  PG_DATABASE_URL: postgres://postgres:${PG_PASSWORD:?defina PG_PASSWORD}@db:5432/default
  REDIS_URL: redis://redis:6379
  SERVER_URL: https://${JEAN_DOMAIN:?defina JEAN_DOMAIN}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?defina ENCRYPTION_KEY}
  STORAGE_TYPE: local
  TELEMETRY_ENABLED: "false"
  EMAIL_DRIVER: ${EMAIL_DRIVER:-logger}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@example.invalid}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Jean CRM}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
  EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
  EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}

services:
  server:
    image: twentycrm/twenty:${TWENTY_TAG:-v2.9.0}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      <<: *twenty-env
      NODE_PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 10s
      timeout: 5s
      retries: 30
    restart: always

  worker:
    image: twentycrm/twenty:${TWENTY_TAG:-v2.9.0}
    command: ["yarn", "worker:prod"]
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true" # o servidor já migra
      DISABLE_CRON_JOBS_REGISTRATION: "true" # o servidor já registra
    depends_on:
      server:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:?defina PG_PASSWORD}
    healthcheck:
      test: pg_isready -U postgres -h localhost -d default
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      JEAN_DOMAIN: ${JEAN_DOMAIN:?defina JEAN_DOMAIN}
      # Obrigatório (falha fechada): só estes IPs acessam o CRM. Liberar a todos = "0.0.0.0/0 ::/0".
      JEAN_ALLOWED_IPS: ${JEAN_ALLOWED_IPS:?defina JEAN_ALLOWED_IPS (ver docs/JEAN_PRODUCTION.md)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      server:
        condition: service_healthy
    restart: always

volumes:
  db-data:
  server-local-data:
  caddy-data:
